<div class="flex justify-center mt-5">
  <p-card class="max-w-sm w-full">
    <ng-template #header>
      <div class="flex justify-between items-center p-4">
        <div class="flex items-center gap-3">
          <i
            (click)="back()"
            class="pi pi-arrow-left cursor-pointer"
          ></i>

          <h3 class="m-0 text-xl font-semibold">
            Detail Unit
          </h3>
        </div>

        <button
          pButton
          type="button"
          text="true"
          severity="primary"
          (click)="enableEdit()"
        >
        <i class="pi pi-file-edit"></i>
        </button>
      </div>
    </ng-template>

    <form class="space-y-6 mt-3">
      <!-- Name -->
      <div class="flex flex-col gap-2">
        <label pLabel for="name">Name</label>

        <input
          pInputText
          id="name"
          name="name"
          type="text"
          [disabled]="!isEditing()"
          [ngModel]="unit()?.name"
          (ngModelChange)="updateName($event)"
        />
      </div>

      <!-- Short Name (Remove if your interface doesn't have it) -->
      <div class="flex flex-col gap-2">
        <label pLabel for="short_name">Short Name</label>

        <input
          pInputText
          id="short_name"
          name="short_name"
          type="text"
          [disabled]="!isEditing()"
          [ngModel]="unit()?.symbol"
          (ngModelChange)="updateShortName($event)"
        />
      </div>

    </form>

    <ng-template #footer>
      <div class="flex justify-between items-center">
        <div>
          <button
            type="button"
            pButton
            text="true"
            class="p-0 m-1"
            severity="danger"
            (click)="delete($event, unit()?.id)"
          >
          <i class="pi pi-trash"></i>
            Delete
          </button>
        </div>

        <p-confirmdialog></p-confirmdialog>

        <div class="flex gap-2">
          <button
            type="button"
            pButton
            text="ture"
            severity="secondary"
            class="p-0 m-1"
            (click)="cancel()"
          >
            Cancel
          </button>

          <button
            type="button"
            pButton
            text="true"
            class="p-0 m-1"
            (click)="save()"
          >
          <i class="pi pi-save"></i>
            Save
          </button>
        </div>
      </div>
    </ng-template>
  </p-card>
</div>
