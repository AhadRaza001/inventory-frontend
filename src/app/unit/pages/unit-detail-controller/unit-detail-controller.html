<p-toolbar class="detail-toolbar">
  <ng-template #start>
    <i (click)="back()" class="pi pi-arrow-left cursor-pointer"></i>
    <div class="ms-3 me-5 h-7 border-l border-surface-300"></div>

    <div class="btns">
      <button type="button" pButton variant="text" class="p-0" (click)="save()">
        <i class="pi pi-save"></i>
        Save
      </button>

      <button
        type="button"
        pButton
        variant="text"
        class="p-0 m-1"
        severity="danger"
        (click)="delete($event, unit()?.id)"
      >
        <i class="pi pi-trash"></i>
        Delete
      </button>

      <button pButton type="button" variant="text" severity="info" (click)="enableEdit()">
        <i class="pi pi-file-edit"></i>
        Edit
      </button>

      <button
        pButton
        type="button"
        variant="text"
        class="p-0 m-1"
        severity="secondary"
        (click)="cancel()"
      >
        Cancel
      </button>
    </div>
  </ng-template>

  <ng-template #end>
    <button pButton type="button" variant="text" (click)="refresh()">
      <i class="pi pi-refresh"></i>
    </button>
  </ng-template>
</p-toolbar>

<div class="flex justify-center mt-5">
  <p-card class="max-w-sm w-full">
    <ng-template #header>
      <div class="flex justify-between items-center p-4">
        <div class="flex items-center gap-3">
          <h3 class="m-0 text-xl font-semibold">Unit Details</h3>
        </div>
      </div>
    </ng-template>

    <form class="space-y-6 mt-3">
      <!-- Name -->
      <div class="flex flex-col gap-2">
        <label for="name" class="block mb-2 font-semibold text-900">Name</label>
        <input
          pInputText
          id="name"
          name="name"
          type="text"
          [disabled]="!isEditing()"
          [ngModel]="unit()?.name"
          (ngModelChange)="updateName($event)"
        />
      </div>

      <!-- Short Name -->
      <div class="flex flex-col gap-2">
        <label for="short_name" class="block mb-2 font-semibold text-900">Short Name</label>
        <input
          pInputText
          id="short_name"
          name="short_name"
          type="text"
          [disabled]="!isEditing()"
          [ngModel]="unit()?.symbol"
          (ngModelChange)="updateShortName($event)"
        />
      </div>
    </form>
  </p-card>
</div>
