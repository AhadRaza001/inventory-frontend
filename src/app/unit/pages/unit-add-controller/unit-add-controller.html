<div class="flex justify-center mt-5">
  <p-card class="max-w-sm w-full">
    <ng-template #header>
      <div class="flex justify-between items-center p-4">
        <div class="flex items-center gap-3">
          <i (click)="back()" class="pi pi-arrow-left cursor-pointer"></i>
          <h3 class="m-0 text-xl font-semibold">New Unit</h3>
        </div>
      </div>
    </ng-template>

    <form class="space-y-6 mt-3">
      <!-- Name -->
      <div class="flex flex-col gap-2">
        <label pLabel for="name">Name</label>

        <input
          pInputText
          id="name"
          [formField]="unitForm.name"
          class="w-full"
        />

        <div class="text-red-500">
          @if (unitForm.name().touched()) {
            @for (item of unitForm.name().errors(); track $index) {
              {{ item.message }}
            }
          }
        </div>
      </div>

      <!-- Description -->
      <div class="flex flex-col gap-2">
        <label for="description">Description</label>

        <textarea
          pTextarea
          id="description"
          rows="4"
          [formField]="unitForm.symbol"
          class="w-full p-1 border border-gray-400 rounded-md"
        ></textarea>

        <div class="text-red-500">
          @if (unitForm.symbol().touched()) {
            @for (item of unitForm.symbol().errors(); track $index) {
              {{ item.message }}
            }
          }
        </div>
      </div>
    </form>

    <ng-template #footer>
      <div class="flex justify-end">
        <button
          pButton
          label="Save"
          text="true"
          (click)="submit()"
        >
      <i class="pi pi-save">Save</i>  
      </button>
      </div>
    </ng-template>
  </p-card>
</div>
