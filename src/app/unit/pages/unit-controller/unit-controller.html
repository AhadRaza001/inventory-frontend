<p-toolbar styleClass="mb-3">
  <ng-template #start>
    <p-floatlabel variant="on">
      <input
        pInputText
        id="unit_search"
        [(ngModel)]="searchValue"
        autocomplete="off"
        (input)="table.filterGlobal($any($event.target).value, 'contains')"
      />

      <label for="unit_search">Search Units</label>
    </p-floatlabel>
  </ng-template>

  <ng-template #end>
    <button
      pButton
      label="New"
      routerLink="/unit/createUnit"
    >
  <span class="pi pi-plus"> Add</span>  
  </button>
  </ng-template>
</p-toolbar>

<p-table
  #table
  [value]="units()"
  [globalFilterFields]="['name', 'symbol']"
  [tableStyle]="{ 'min-width': '50rem' }"
  [paginator]="true"
  [rows]="10"
  [rowsPerPageOptions]="[5, 10, 20]"
  [lazy]="true"
  [loading]="loading"
  [totalRecords]="totalRecords"
  (onLazyLoad)="loadUnits($event)"
  [scrollable]="true"
  scrollHeight="calc(100vh - 225px)"
>
  <ng-template #header>
    <tr>
      <th pSortableColumn="id">
        ID
        <p-sort-icon field="id"></p-sort-icon>
        <p-column-filter
          field="id"
          type="numeric"
          display="menu">
        </p-column-filter>
      </th>

      <th pSortableColumn="name">
        Name
        <p-sort-icon field="name"></p-sort-icon>
        <p-column-filter
          field="name"
          type="text"
          display="menu">
        </p-column-filter>
      </th>

      <th pSortableColumn="symbol">
        Short Name
        <p-sort-icon field="symbol"></p-sort-icon>
        <p-column-filter
          field="symbol"
          type="text"
          display="menu">
        </p-column-filter>
      </th>

  </ng-template>

  <ng-template #body let-item>
    <tr
      class="table_row"
      style="cursor: pointer"
      (click)="detailUnit(item.id)"
    >
      <td>{{ item.id }}</td>
      <td>{{ item.name }}</td>
      <td>{{ item.symbol }}</td>
    </tr>
  </ng-template>
</p-table>
