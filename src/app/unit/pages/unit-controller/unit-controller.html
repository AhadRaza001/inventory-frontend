<app-table-toolbar
  searchPlaceholder="Search units"
  [showBack]="true"
  [showNew]="true"
  [showDelete]="true"
  [showExcel]="true"
  [showPdf]="true"
  [showRefresh]="true"

  [deleteDisabled]="selecteditems.length === 0"
  [excelDisabled]="selecteditems.length === 0"
  [pdfDisabled]="selecteditems.length === 0"


  (searchChange)="onSearch($event)"
  (backClick)="back()"
  (newClick)="onNew()"
  (deleteClick)="deleteSelected()"
  (excelClick)="exportSelected()"
  (pdfClick)="exportPDF()"
  (refreshClick)="refresh()"
/>

<p-table
  #table
  [value]="units()"
  [globalFilterFields]="['name', 'symbol']"
  [tableStyle]="{ 'min-width': '50rem' }"
  [paginator]="true"
  [rows]="10"
  [rowsPerPageOptions]="[5, 10, 20]"
  [lazy]="true"
  [totalRecords]="totalRecords"
  (onLazyLoad)="loadUnits($event)"
  [scrollable]="true"
  [(selection)]="selecteditems"
  scrollHeight="calc(100vh - 225px)"
>
  <ng-template #header>
    <tr>
      <th style="width: 4rem">
        <p-tableheadercheckbox></p-tableheadercheckbox>
      </th>
      <th pSortableColumn="id">
        ID
        <p-sort-icon field="id"></p-sort-icon>
        <p-column-filter field="id" type="numeric" display="menu"> </p-column-filter>
      </th>

      <th pSortableColumn="name">
        Name
        <p-sort-icon field="name"></p-sort-icon>
        <p-column-filter field="name" type="text" display="menu"> </p-column-filter>
      </th>

      <th pSortableColumn="symbol">
        Short Name
        <p-sort-icon field="symbol"></p-sort-icon>
        <p-column-filter field="symbol" type="text" display="menu"> </p-column-filter>
      </th></tr
  ></ng-template>

  <ng-template #body let-item let-rowIndex="rowIndex">
    <tr class="table_row">
      <td>
        <p-tablecheckbox [value]="item"></p-tablecheckbox>
      </td>
      <td class="rowId" (click)="detailUnit(item.id)">{{ item.id }}</td>
      <td>{{ item.name }}</td>
      <td>{{ item.symbol }}</td>
    </tr>
  </ng-template>
</p-table>
