<p-toolbar styleClass="mb-3">
  <ng-template #start>
    <i (click)="back()" class="pi pi-arrow-left cursor-pointer"></i>
    <div class="ms-3 me-5 h-7 border-l border-surface-300"></div>

    <div class="btns">
      <button type="button" pButton variant="text" class="p-0" (click)="save()">
        <i class="pi pi-save"></i>
        Save
      </button>
      <button
        type="button"
        pButton
        variant="text"
        class="p-0 m-1"
        severity="danger"
        (click)="delete($event, category()?.id)"
      >
        <i class="pi pi-trash"></i>
        Delete
      </button>
      <button pButton type="button" variant="text" severity="info" (click)="enableEdit()">
        <i class="pi pi-file-edit"> Edit</i>
      </button>
      <button
        pButton
        type="button"
        variant="text"
        class="p-0"
        class="m-1"
        severity="secondary"
        (click)="cancel()"
      >
        Cancel
      </button>
    </div>
  </ng-template>
  <ng-template #end>
    <button pButton text="true" (click)="refresh()"><i class="pi pi-refresh"></i></button>
  </ng-template>
</p-toolbar>

<div class="flex justify-center mt-5">
  <p-card class="max-w-sm w-full">
    <ng-template #header>
      <div class="flex justify-between items-center p-4">
        <div class="flex items-center gap-3">
          <h3 class="m-0 text-xl font-semibold">Category Details</h3>
        </div>
      </div>
    </ng-template>
    <form class="space-y-6 mt-3">
      <div class="mb-5">
        <p-tag severity="info" [value]="'ID : ' + category()?.id"></p-tag>
      </div>
      <div class="flex flex-col gap-2">
        <label for="name" class="block mb-2 font-semibold text-900">Name</label>
        <input
          pInputText
          id="name"
          [disabled]="!isEditing()"
          name="name"
          type="text"
          [ngModel]="category()?.name"
          (ngModelChange)="updateName($event)"
        />
      </div>
      <div class="flex flex-col gap-2">
        <div class="flex items-center justify-between">
          <label class="block mb-2 font-semibold text-900 flex-1" for="description"
            >Description</label
          >
        </div>
        <textarea
          pInputText
          id="description"
          name="description"
          rows="3"
          class="w-full resize-none"
          type="text"
          [ngModel]="category()?.description"
          [disabled]="!isEditing()"
          (ngModelChange)="updateDescription($event)"
        ></textarea>
      </div>
    </form>
  </p-card>
</div>
