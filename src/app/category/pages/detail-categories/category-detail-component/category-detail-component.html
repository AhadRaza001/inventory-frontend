<div class="flex justify-center mt-5">
  <p-card class="max-w-sm w-full">
    <ng-template pTemplate="header">
      <div class="flex justify-between items-center p-4">

        <div class="flex items-center gap-3">
          <i (click)="back()" class="pi pi-arrow-left cursor-pointer"></i>
          <h3 class="m-0 text-xl font-semibold">Detail Category</h3>
        </div>

        <button
          pButton
          type="button"
          icon="pi pi-file-edit"
          label=""
          severity="primary"
          (click)="enableEdit()"
        ></button>
      </div>
    </ng-template>
    <form class="space-y-6 mt-3">
      <div class="flex flex-col gap-2">
        <label pLabel for="name">Name</label>
        <input
          pInputText
          id="name"
          [disabled]="!isEditing()"
          name="name"
          type="text"
          [ngModel]="category()?.name"
          (ngModelChange)="updateName($event)"
        />
      </div>
      <div class="flex flex-col gap-2">
        <div class="flex items-center justify-between">
          <label pLabel for="description" class="flex-1">Description</label>
        </div>
        <textarea
          pInputText
          id="description"
          name="description"
          type="text"
          [ngModel]="category()?.description"
          [disabled]="!isEditing()"
          (ngModelChange)="updateDescription($event)"
        ></textarea>
      </div>
    </form>
    <ng-template #footer>
      <div class="flex justify-between items-center">
        <div class="mt-2 text-right text-surface-500 text-sm">
          <button type="button" icon="pi pi-trash" pButton  varient="link" class="p-0 m-1" severity="danger" (click)="delete($event,category()?.id)">Delete</button>
        </div>
        <p-confirmDialog></p-confirmDialog>
        <div class="mt-2 text-right text-surface-500 text-sm">
          <button
            type="button"
            pButton
            variant="link"
            class="p-0"
            class="m-1"
            severity="secondary"
            (click)="cancel()"
          >
            Cancel
          </button>
          <button
            type="button"
            pButton
            variant="link"
            class="p-0"
            icon="pi pi-save"
            (click)="save()"
          >
            Save
          </button>
        </div>
      </div>
    </ng-template>
  </p-card>
</div>
