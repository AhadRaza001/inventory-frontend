<p-toolbar styleClass="mb-3">
  <ng-template #start>
    <p-floatlabel variant="on">
      <input
        pInputText
        id="over_label"
        [(ngModel)]="searchValue"
        autocomplete="off"
        (input)="table.filterGlobal($any($event.target).value, 'contains')"
      />

      <label for="over_label"> Search categories </label>
    </p-floatlabel>
  </ng-template>

  <ng-template #end>
    <button pButton  routerLink="/category/createCategory">
      <i class="pi pi-plus"> Add</i>
    </button>
  </ng-template>
</p-toolbar>

<p-table
  #table
  [value]="categories()"
  [globalFilterFields]="['name', 'description']"
  [tableStyle]="{ 'min-width': '50rem' }"
  [paginator]="true"
  [rows]="10"
  [rowsPerPageOptions]="[5, 10, 20]"
  [lazy]="true"
  (onLazyLoad)="loadCategories($event)"
  [totalRecords]="totalRecords"
  [scrollable]="true"
  scrollHeight="calc(100vh - 225px)"
>
  <ng-template #header>
    <tr>
      <th pSortableColumn="id">
        ID
        <p-sort-icon field="id" />
        <p-column-filter field="id" type="numeric" display="menu"> </p-column-filter>
      </th>

      <th pSortableColumn="name">
        Name
        <p-sort-icon field="name" />
        <p-column-filter field="name" type="text" display="menu"> </p-column-filter>
      </th>

      <th pSortableColumn="description">
        Description
        <p-sort-icon field="description" />
        <p-column-filter field="description" type="text" display="menu"> </p-column-filter>
      </th>
    </tr> 
  </ng-template>
  <ng-template #body let-item let-rowIndex="rowIndex">
    <tr (click)="detail_category(item.id)" style="cursor: pointer" class="table_row">
      <td>{{ item.id }}</td>
      <td>{{ item.name }}</td>
      <td>{{ item.description }}</td>
    </tr>
  </ng-template>
</p-table>
