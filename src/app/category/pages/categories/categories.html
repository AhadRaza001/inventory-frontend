<p-confirmdialog></p-confirmdialog>
<p-toolbar styleClass="mb-3">
  <ng-template #start>
    <i (click)="back()" class="pi pi-arrow-left cursor-pointer"></i>
    <div class="ms-3 me-5 h-7 border-l border-surface-300"></div>

    <p-floatlabel variant="on">
      <p-iconfield>
        <p-inputicon class="pi pi-search"></p-inputicon>

        <input
          pInputText
          id="over_label"
          [(ngModel)]="searchValue"
          autocomplete="off"
          (input)="table.filterGlobal($any($event.target).value, 'contains')"
        />
      </p-iconfield>

      <label for="over_label">Search categories</label>
    </p-floatlabel>

    <div class="ms-5 h-7 border-l border-surface-300"></div>
    <div class="btns">
      <button pButton text="true" routerLink="/category/createCategory" class="ms-2">
        <i class="pi pi-plus"> New</i>
      </button>
      <button
        pButton
        text="true"
        severity="danger"
        [disabled]="selectedCategories.length === 0"
        (click)="deleteSelected()"
      >
        <i class="pi pi-trash"> Delete</i>
      </button>
      <button
        pButton
        text="true"
        severity="contrast"
        [disabled]="selectedCategories.length === 0"
        (click)="exportSelected()"
      >
        <i class="pi pi-file-excel"> Excel</i>
      </button>
      <button
        pButton
        text="true"
        severity="contrast"
        [disabled]="selectedCategories.length === 0"
        (click)="exportPDF()"
      >
        <i class="pi pi-file-pdf"></i>
        <span class="ml-1">PDF</span>
      </button>
    </div>
  </ng-template>
  <ng-template #end>
    <button pButton text="true" (click)="refresh()"><i class="pi pi-refresh"></i></button>
  </ng-template>
</p-toolbar>

<p-table
  #table
  [value]="categories()"
  [globalFilterFields]="['name', 'description']"
  [tableStyle]="{ 'min-width': '50rem' }"
  [paginator]="true"
  [rows]="10"
  [rowsPerPageOptions]="[5, 10, 20]"
  [lazy]="true"
  (onLazyLoad)="loadCategories($event)"
  [totalRecords]="totalRecords"
  [scrollable]="true"
  scrollHeight="calc(100vh - 225px)"
  [(selection)]="selectedCategories"
  dataKey="id"
>
  <ng-template #header>
    <tr>
      <th style="width: 4rem">
        <p-tableheadercheckbox></p-tableheadercheckbox>
      </th>
      <th pSortableColumn="id">
        ID
        <p-sort-icon field="id" />

        <p-column-filter field="id" type="numeric" display="menu"> </p-column-filter>

      </th>
      <th pSortableColumn="name">
        Name
        <p-sort-icon field="name" />
        <p-column-filter field="name" type="text" display="menu"> </p-column-filter>
      </th>

      <th pSortableColumn="description">
        Description
        <p-sort-icon field="description" />
        <p-column-filter field="description" type="text" display="menu"> </p-column-filter>
      </th>
    </tr>
  </ng-template>
  <ng-template #body let-item let-rowIndex="rowIndex">
    <tr style="cursor: pointer" class="table_row">
      <td>
        <p-tablecheckbox [value]="item"></p-tablecheckbox>
      </td>
      <td (click)="detail_category(item.id)" class="rowId">{{ item.id }}</td>
      <td style="cursor: text">{{ item.name }}</td>
      <td style="cursor: text">{{ item.description }}</td>
    </tr>
  </ng-template>
</p-table>
