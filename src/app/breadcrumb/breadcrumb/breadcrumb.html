<p-confirmdialog />

@if (visible()) {
  <div class="breadcrumb-bar">
    <p-breadcrumb [home]="home" [model]="items()" />

    <button
      pButton
      type="button"
      class="logout-btn"
      severity="danger"
      text
      size="small"
      (click)="logout($event)"
    >
      <i class="pi pi-sign-out"></i>
      <span class="ml-2">Log Out</span>
    </button>
  </div>
}
