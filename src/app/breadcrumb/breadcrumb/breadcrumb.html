<p-confirmdialog />

@if (visible()) {
  <div class="breadcrumb-bar">
    <p-breadcrumb [home]="home" [model]="items()" />

    <div class="actions">
      <button
        pButton
        type="button"
        class="action-btn"
        severity="primary"
        text
        size="small"
        (click)="signup()"
      >
        <i class="pi pi-user-plus"></i>
        <span class="ml-2">Sign up</span>
      </button>
      <button
        pButton
        type="button"
        class="action-btn"
        severity="danger"
        text
        size="small"
        (click)="logout($event)"
      >
        <i class="pi pi-sign-out"></i>
        <span class="ml-2">Log Out</span>
      </button>
    </div>
  </div>
}
