<div class="card">
  <p-toolbar [style]="{ 'border-radius': '3rem', padding: '1rem 1rem 1rem 1.5rem' }">
    <ng-template #start>
  
      <button [disabled]="sidebarService.pinned()" pButton icon="pi pi-bars" (click)="sidebarService.toggle()"></button>

      <app-breadcrumb></app-breadcrumb>
    </ng-template>
    <ng-template #end>
      <div class="flex items-center gap-3">
        <p-button label="share"  severity="contrast" size="small" />
        <p-avatar
          image="https://primefaces.org/cdn/primeng/images/demo/avatar/amyelsner.png"
          [style]="{ width: '32px', height: '32px' }"
        />
        <i class="pi pi-sign-out" title="logout" (click)="logout()" style="cursor: pointer;"></i>
      </div>
    </ng-template>
  </p-toolbar>
</div>
