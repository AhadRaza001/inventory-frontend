<p-toolbar styleClass="mb-3">
  <!-- LEFT SIDE -->
  <ng-template #start>
    <div class="toolbar-start">
      @if (showBack) {
        <button
          pButton
          type="button"
          [text]="true"
          [rounded]="true"
          aria-label="Back"
          (click)="onBack()"
        >
          <i class="pi pi-arrow-left"></i>
        </button>

        <div class="divider"></div>
      }

      <!-- Search -->
      <p-floatlabel variant="on" class="search">
        <p-iconfield>
          <p-inputicon class="pi pi-search" />
          <input
            pInputText
            id="table-toolbar-search"
            [ngModel]="searchValue"
            (ngModelChange)="onSearch($event)"
            autocomplete="off"
          />
        </p-iconfield>
        <label for="table-toolbar-search">{{ searchPlaceholder }}</label>
      </p-floatlabel>

      <div class="divider"></div>

      <!-- Buttons -->
      <div class="btns">
        @if (showNew) {
          <button pButton type="button" [text]="true" (click)="onNew()">
            <i class="pi pi-plus"></i>
            <span class="btn-label">New</span>
          </button>
        }

        @if (showDelete) {
          <button
            pButton
            type="button"
            [text]="true"
            severity="danger"
            [disabled]="deleteDisabled"
            (click)="onDelete()"
          >
            <i class="pi pi-trash"></i>
            <span class="btn-label">Delete</span>
          </button>
        }

        @if (showExcel) {
          <button
            pButton
            type="button"
            [text]="true"
            severity="contrast"
            [disabled]="excelDisabled"
            (click)="onExcel()"
          >
            <i class="pi pi-file-excel"></i>
            <span class="btn-label">Excel</span>
          </button>
        }

        @if (showPdf) {
          <button
            pButton
            type="button"
            [text]="true"
            severity="contrast"
            [disabled]="pdfDisabled"
            (click)="onPdf()"
          >
            <i class="pi pi-file-pdf"></i>
            <span class="btn-label">PDF</span>
          </button>
        }
      </div>
    </div>
  </ng-template>

  <!-- RIGHT SIDE -->
  <ng-template #end>
    @if (showRefresh) {
      <div class="toolbar-end">
        <button pButton type="button" [text]="true" aria-label="Refresh" (click)="onRefresh()">
          <i class="pi pi-refresh"></i>
        </button>
      </div>
    }
  </ng-template>
</p-toolbar>
