<div class="sticky top-0 z-50 bg-surface-0">
  <p-toolbar class="detail-toolbar">
    <ng-template #start>
      <i (click)="back()" class="pi pi-arrow-left cursor-pointer"></i>
      <div class="ms-3 me-5 h-7 border-l border-surface-300"></div>

      <div class="btns">
        <button
          type="button"
          pButton
          variant="text"
          class="p-0"
          [disabled]="!isEditing()"
          (click)="save()"
        >
          <i class="pi pi-save"></i>
          Save
        </button>

        <button
          type="button"
          pButton
          variant="text"
          class="p-0 m-1"
          severity="danger"
          (click)="delete($event, store()?.id)"
        >
          <i class="pi pi-trash"></i>
          Delete
        </button>

        <button pButton type="button" variant="text" severity="info" (click)="enableEdit()">
          <i class="pi pi-file-edit"></i>
          Edit
        </button>

        <button
          pButton
          type="button"
          variant="text"
          class="p-0 m-1"
          severity="secondary"
          [disabled]="!isEditing()"
          (click)="cancel()"
        >
          Cancel
        </button>
      </div>
    </ng-template>

    <ng-template #end>
      <button pButton type="button" variant="text" (click)="refresh()">
        <i class="pi pi-refresh"></i>
      </button>
    </ng-template>
  </p-toolbar>
</div>

<div class="flex justify-center mt-5">
  <p-card class="max-w-2xl w-full">
    <ng-template #header>
      <div class="flex justify-between items-center p-4">
        <h3 class="m-0 text-xl font-semibold">Store Details</h3>
      </div>
    </ng-template>

    <form class="mt-3 grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Name -->
      <div class="flex flex-col gap-2">
        <label for="name" class="block mb-2 font-semibold text-900">Name</label>
        <input
          pInputText
          id="name"
          name="name"
          type="text"
          [disabled]="!isEditing()"
          [ngModel]="store()?.name"
          (ngModelChange)="updateField('name', $event)"
        />
      </div>

      <!-- Phone -->
      <div class="flex flex-col gap-2">
        <label for="phone" class="block mb-2 font-semibold text-900">Phone</label>
        <input
          pInputText
          id="phone"
          name="phone"
          type="text"
          [disabled]="!isEditing()"
          [ngModel]="store()?.phone"
          (ngModelChange)="updateField('phone', $event || null)"
        />
      </div>

      <!-- Address -->
      <div class="flex flex-col gap-2 md:col-span-2">
        <label for="address" class="block mb-2 font-semibold text-900">Address</label>
        <textarea
          pTextarea
          id="address"
          name="address"
          rows="3"
          [disabled]="!isEditing()"
          [ngModel]="store()?.address"
          (ngModelChange)="updateField('address', $event)"
        ></textarea>
      </div>

      <!-- Description -->
      <div class="flex flex-col gap-2 md:col-span-2">
        <label for="description" class="block mb-2 font-semibold text-900">Description</label>
        <textarea
          pTextarea
          id="description"
          name="description"
          rows="3"
          [disabled]="!isEditing()"
          [ngModel]="store()?.description"
          (ngModelChange)="updateField('description', $event || null)"
        ></textarea>
      </div>
    </form>
  </p-card>
</div>
