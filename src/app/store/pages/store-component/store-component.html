<app-table-toolbar
  searchPlaceholder="Search stores"
  [showBack]="true"
  [showNew]="true"
  [showDelete]="true"
  [showExcel]="true"
  [showPdf]="true"
  [showRefresh]="true"
  [deleteDisabled]="selecteditems.length === 0"
  [excelDisabled]="selecteditems.length === 0"
  [pdfDisabled]="selecteditems.length === 0"
  (searchChange)="onSearch($event)"
  (backClick)="back()"
  (newClick)="onNew()"
  (deleteClick)="deleteSelected()"
  (excelClick)="exportSelected()"
  (pdfClick)="exportPDF()"
  (refreshClick)="refresh()"
/>

<p-table
  #table
  [value]="stores()"
  [globalFilterFields]="['name', 'phone', 'address', 'description']"
  [tableStyle]="{ width: '100%' }"
  [paginator]="true"
  [rows]="10"
  [rowsPerPageOptions]="[5, 10, 20]"
  [lazy]="true"
  [totalRecords]="totalRecords"
  (onLazyLoad)="loadStores($event)"
  [(selection)]="selecteditems"
  [scrollable]="true"
  scrollHeight="calc(100vh - 225px)"
>
  <ng-template #header>
    <tr>
      <th style="width: 4rem">
        <p-tableheadercheckbox></p-tableheadercheckbox>
      </th>

      <th pSortableColumn="name">
        Name
        <p-sort-icon field="name"></p-sort-icon>
        <p-column-filter field="name" type="text" display="menu"></p-column-filter>
      </th>

      <th pSortableColumn="phone">
        Phone
        <p-sort-icon field="phone"></p-sort-icon>
        <p-column-filter field="phone" type="text" display="menu"></p-column-filter>
      </th>

      <th pSortableColumn="address">
        Address
        <p-sort-icon field="address"></p-sort-icon>
        <p-column-filter field="address" type="text" display="menu"></p-column-filter>
      </th>

      <th pSortableColumn="description">
        Description
        <p-sort-icon field="description"></p-sort-icon>
        <p-column-filter field="description" type="text" display="menu"></p-column-filter>
      </th>

      <th pSortableColumn="created_at">
        Created at
        <p-sort-icon field="created_at"></p-sort-icon>
        <p-column-filter field="created_at" type="date" display="menu"></p-column-filter>
      </th>
    </tr>
  </ng-template>

  <ng-template #body let-item>
    <tr class="table_row">
      <td>
        <p-tablecheckbox [value]="item"></p-tablecheckbox>
      </td>

      <td class="rowId" (click)="detailStore(item.id)">{{ item.name }}</td>
      <td>{{ item.phone }}</td>
      <td>{{ item.address }}</td>
      <td>{{ item.description }}</td>
      <td>{{ item.created_at | date: 'dd-MM-yyyy' }}</td>
    </tr>
  </ng-template>
</p-table>
