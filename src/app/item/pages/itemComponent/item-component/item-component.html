<p-toolbar styleClass="mb-3">
  <ng-template #start>
    <p-floatlabel variant="on">
      <input
        pInputText
        id="item_search"
        [(ngModel)]="searchValue"
        autocomplete="off"
        (input)="table.filterGlobal($any($event.target).value, 'contains')"
      />

      <label for="item_search">Search Items</label>
    </p-floatlabel>
  </ng-template>

  <ng-template #end>
    <button pButton label="New" icon="pi pi-plus" [routerLink]="[('/item/createItem')]"></button>
  </ng-template>
</p-toolbar>

<p-table
  #table
  [value]="units()"
  [globalFilterFields]="['name', 'sku','purchase_price','sale_price','status','created_at']"
  [tableStyle]="{ 'min-width': '50rem' }"
  [paginator]="true"
  [rows]="10"
  [rowsPerPageOptions]="[5, 10, 20]"
  [lazy]="true"
  [loading]="loading"
  [totalRecords]="totalRecords"
  (onLazyLoad)="loadUnits($event)"
  [scrollable]="true"
  scrollHeight="calc(100vh - 225px)"

>
 <ng-template pTemplate="header">
  <tr>
    <!-- <th pSortableColumn="id" style="width: 6rem">
      ID
      <p-sortIcon field="id"></p-sortIcon>
      <p-columnFilter
        field="id"
        type="numeric"
        display="menu">
      </p-columnFilter>
    </th> -->

    <th pSortableColumn="sku">
      SKU
      <p-sortIcon field="sku"></p-sortIcon>
      <p-columnFilter
        field="sku"
        type="text"
        display="menu">
      </p-columnFilter>
    </th>

    <th pSortableColumn="name">
      Name
      <p-sortIcon field="name"></p-sortIcon>
      <p-columnFilter
        field="name"
        type="text"
        display="menu">
      </p-columnFilter>
    </th>

    <th pSortableColumn="category.name">
      Category
      <p-sortIcon field="category.name"></p-sortIcon>
      <p-columnFilter
        field="category.name"
        type="text"
        display="menu">
      </p-columnFilter>
    </th>

    <th pSortableColumn="unit.name">
      Unit
      <p-sortIcon field="unit.name"></p-sortIcon>
      <p-columnFilter
        field="unit.name"
        type="text"
        display="menu">
      </p-columnFilter>
    </th>

    <th pSortableColumn="purchase_price">
      Purchase Price
      <p-sortIcon field="purchase_price"></p-sortIcon>
      <p-columnFilter
        field="purchase_price"
        type="numeric"
        display="menu">
      </p-columnFilter>
    </th>

    <th pSortableColumn="sale_price">
      Sale Price
      <p-sortIcon field="sale_price"></p-sortIcon>
      <p-columnFilter
        field="sale_price"
        type="numeric"
        display="menu">
      </p-columnFilter>
    </th>

    <!-- <th pSortableColumn="reorder_level">
      Reorder Level
      <p-sortIcon field="reorder_level"></p-sortIcon>
      <p-columnFilter
        field="reorder_level"
        type="numeric"
        display="menu">
      </p-columnFilter>
    </th> -->

    <th pSortableColumn="status" style="width: 8rem">
      Status
      <p-sortIcon field="status"></p-sortIcon>
      <p-columnFilter field="status" matchMode="equals" display="menu">
        <ng-template pTemplate="filter" let-value let-filter="filterCallback">
          <p-select
            [ngModel]="value"
            [options]="statusOptions"
            optionLabel="label"
            optionValue="value"
            placeholder="Any"
            (onChange)="filter($event.value)"
            [showClear]="true">
          </p-select>
        </ng-template>
      </p-columnFilter>
    </th>
  </tr>
</ng-template>

<ng-template pTemplate="body" let-item>
  <tr
    class="table_row"
    style="cursor: pointer"
    (click)="detailItem(item.id)"
  >
    <!-- <td>{{ item.id }}</td> -->
    <td>{{ item.sku }}</td>
    <td>{{ item.name }}</td>
    <td>{{ item.category?.name ?? '-' }}</td>
    <td>{{ item.unit?.name ?? '-' }}</td>
    <td>{{ item.purchase_price | currency:'Rs ':'symbol':'1.2-2' }}</td>
    <td>{{ item.sale_price | currency:'Rs ':'symbol':'1.2-2' }}</td>
    <!-- <td>{{ item.reorder_level }}</td> -->
    <td>
      <span
        class="px-2 py-1 rounded text-xs font-medium"
        [ngClass]="item.status === 'active' 
          ? 'bg-green-100 text-green-700' 
          : 'bg-red-100 text-red-700'">
        {{ item.status }}
      </span>
    </td>
  </tr>
</ng-template>
</p-table>
