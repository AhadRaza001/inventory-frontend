<p-toolbar class="detail-toolbar">
  <ng-template #start>
    <i (click)="back()" class="pi pi-arrow-left cursor-pointer"></i>
    <div class="ms-3 me-5 h-7 border-l border-surface-300"></div>

    <div class="btns">
      <button type="button" pButton variant="text" class="p-0" (click)="save()">
        <i class="pi pi-save"></i>
        Save
      </button>

      <button
        type="button"
        pButton
        variant="text"
        class="p-0 m-1"
        severity="danger"
        (click)="delete($event, item()?.id)"
      >
        <i class="pi pi-trash"></i>
        Delete
      </button>

      <button pButton type="button" variant="text" severity="info" (click)="enableEdit()">
        <i class="pi pi-file-edit"></i>
        Edit
      </button>

      <button
        pButton
        type="button"
        variant="text"
        class="p-0 m-1"
        severity="secondary"
        (click)="cancel()"
      >
        Cancel
      </button>
    </div>
  </ng-template>

  <ng-template #end>
    <button pButton type="button" variant="text" (click)="refresh()">
      <i class="pi pi-refresh"></i>
    </button>
  </ng-template>
</p-toolbar>

<div class="flex justify-center mt-5">
  <p-card class="max-w-4xl w-full">
    <ng-template #header>
      <div class="flex justify-between items-center p-4">
        <h3 class="m-0 text-xl font-semibold">Item Details</h3>
      </div>
    </ng-template>

    <form class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- SKU -->
      <div class="flex flex-col gap-2">
        <label for="sku" class="block mb-2 font-semibold text-900">SKU</label>
        <input
          pInputText
          class="w-full"
          id="sku"
          name="sku"
          type="text"
          [disabled]="true"
          [ngModel]="item()?.sku"
          (ngModelChange)="updateSku($event)"
        />
      </div>

      <!-- Name -->
      <div class="flex flex-col gap-2">
        <label for="name" class="block mb-2 font-semibold text-900">Name</label>
        <input
          pInputText
          class="w-full"
          id="name"
          name="name"
          type="text"
          [disabled]="!isEditing()"
          [ngModel]="item()?.name"
          (ngModelChange)="updateName($event)"
        />
      </div>

      <!-- Category -->
      <div class="flex flex-col gap-2">
        <label for="category" class="block mb-2 font-semibold text-900">Category</label>
        <p-select
          styleClass="w-full"
          id="category"
          name="category_id"
          [disabled]="!isEditing()"
          [options]="categories()"
          optionLabel="name"
          optionValue="id"
          placeholder="Select a category"
          [ngModel]="item()?.category_id"
          (ngModelChange)="updateCategory($event)"
        ></p-select>
      </div>

      <!-- Unit -->
      <div class="flex flex-col gap-2">
        <label for="unit" class="block mb-2 font-semibold text-900">Unit</label>
        <p-select
          styleClass="w-full"
          id="unit"
          name="unit_id"
          [disabled]="!isEditing()"
          [options]="units()"
          optionLabel="name"
          optionValue="id"
          placeholder="Select a unit"
          [ngModel]="item()?.unit_id"
          (ngModelChange)="updateUnit($event)"
        ></p-select>
      </div>

      <!-- Purchase Price -->
      <div class="flex flex-col gap-2">
        <label for="purchase_price" class="block mb-2 font-semibold text-900">Purchase Price</label>
        <p-input-number
          styleClass="w-full"
          inputId="purchase_price"
          name="purchase_price"
          mode="currency"
          currency="PKR"
          [disabled]="!isEditing()"
          [ngModel]="item()?.purchase_price != null ? +item()!.purchase_price : null"
          (ngModelChange)="updatePurchasePrice($event)"
        ></p-input-number>
      </div>

      <!-- Sale Price -->
      <div class="flex flex-col gap-2">
        <label for="sale_price" class="block mb-2 font-semibold text-900">Sale Price</label>
        <p-input-number
          styleClass="w-full"
          inputId="sale_price"
          name="sale_price"
          mode="currency"
          currency="PKR"
          [disabled]="!isEditing()"
          [ngModel]="item()?.sale_price != null ? +item()!.sale_price : null"
          (ngModelChange)="updateSalePrice($event)"
        ></p-input-number>
      </div>

      <!-- Reorder Level -->
      <div class="flex flex-col gap-2">
        <label for="reorder_level" class="block mb-2 font-semibold text-900">Reorder Level</label>
        <p-input-number
          styleClass="w-full"
          inputId="reorder_level"
          name="reorder_level"
          [disabled]="!isEditing()"
          [ngModel]="item()?.reorder_level"
          (ngModelChange)="updateReorderLevel($event)"
        ></p-input-number>
      </div>

      <!-- Barcode -->
      <div class="flex flex-col gap-2">
        <label for="barcode" class="block mb-2 font-semibold text-900">Barcode</label>
        <input
          pInputText
          class="w-full"
          id="barcode"
          name="barcode"
          type="text"
          [disabled]="!isEditing()"
          [ngModel]="item()?.barcode"
          (ngModelChange)="updateBarcode($event)"
        />
      </div>

      <!-- Status -->
      <div class="flex flex-col gap-2">
        <label for="status" class="block mb-2 font-semibold text-900">Status</label>
        <p-select
          styleClass="w-full"
          id="status"
          name="status"
          [disabled]="!isEditing()"
          [options]="statusOptions"
          optionLabel="label"
          optionValue="value"
          [ngModel]="item()?.status"
          (ngModelChange)="updateStatus($event)"
        ></p-select>
      </div>

      <!-- Description -->
      <div class="flex flex-col gap-2 sm:col-span-2 lg:col-span-3">
        <label for="description" class="block mb-2 font-semibold text-900">Description</label>
        <textarea
          pTextarea
          class="w-full resize-none"
          id="description"
          name="description"
          rows="3"
          [disabled]="!isEditing()"
          [ngModel]="item()?.description"
          (ngModelChange)="updateDescription($event)"
        ></textarea>
      </div>
    </form>
  </p-card>
</div>
