<app-table-toolbar
  searchPlaceholder="Search customers"
  [showBack]="true"
  [showNew]="true"
  [showDelete]="true"
  [showExcel]="true"
  [showPdf]="true"
  [showRefresh]="true"
  [deleteDisabled]="selecteditems.length === 0"
  [excelDisabled]="selecteditems.length === 0"
  [pdfDisabled]="selecteditems.length === 0"
  (searchChange)="onSearch($event)"
  (backClick)="back()"
  (newClick)="onNew()"
  (deleteClick)="deleteSelected()"
  (excelClick)="exportSelected()"
  (pdfClick)="exportPDF()"
  (refreshClick)="refresh()"
/>

<p-table
  #table
  [value]="customers()"
  [tableStyle]="{ 'min-width': '50rem' }"
  [paginator]="true"
  [rows]="10"
  [rowsPerPageOptions]="[5, 10, 20]"
  [lazy]="true"
  [totalRecords]="totalRecords"
  (onLazyLoad)="loadCustomers($event)"
  [scrollable]="true"
  [(selection)]="selecteditems"
  scrollHeight="calc(100vh - 225px)"
>
  <ng-template #header>
    <tr>
      <th style="width: 4rem">
        <p-tableheadercheckbox></p-tableheadercheckbox>
      </th>

      <th pSortableColumn="customer_no">
        Customer No
        <p-sort-icon field="customer_no"></p-sort-icon>
        <p-column-filter field="customer_no" type="text" display="menu"></p-column-filter>
      </th>

      <th pSortableColumn="name">
        Name
        <p-sort-icon field="name"></p-sort-icon>
        <p-column-filter field="name" type="text" display="menu"></p-column-filter>
      </th>

      <!-- <th pSortableColumn="phone">
        Phone
        <p-sort-icon field="phone"></p-sort-icon>
        <p-column-filter field="phone" type="text" display="menu"></p-column-filter>
      </th> -->

      <!-- <th pSortableColumn="email">
        Email
        <p-sort-icon field="email"></p-sort-icon>
        <p-column-filter field="email" type="text" display="menu"></p-column-filter>
      </th> -->

      <th pSortableColumn="city">
        City
        <p-sort-icon field="city"></p-sort-icon>
        <p-column-filter field="city" type="text" display="menu"></p-column-filter>
      </th>

      <th pSortableColumn="credit_limit">
        Credit Limit
        <p-sort-icon field="credit_limit"></p-sort-icon>
        <p-column-filter field="credit_limit" type="numeric" display="menu"></p-column-filter>
      </th>

      <th pSortableColumn="status">
        Status
        <p-sort-icon field="status"></p-sort-icon>
        <p-column-filter field="status" type="text" display="menu"></p-column-filter>
      </th>
    </tr>
  </ng-template>

  <ng-template #body let-item>
    <tr class="table_row">
      <td>
        <p-tablecheckbox [value]="item"></p-tablecheckbox>
      </td>
      <td class="rowId" (click)="detailCustomer(item.id)">{{ item.customer_no }}</td>
      <td>{{ item.name }}</td>
      <!-- <td>{{ item.phone }}</td> -->
      <!-- <td>{{ item.email }}</td> -->
      <td>{{ item.city }}</td>
      <td>{{ item.credit_limit | number: '1.2-2' }}</td>
      <td>
        <p-tag [value]="item.status" [severity]="statusSeverity(item.status)"></p-tag>
      </td>
    </tr>
  </ng-template>
</p-table>
