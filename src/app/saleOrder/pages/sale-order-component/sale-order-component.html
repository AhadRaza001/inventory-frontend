<p-toolbar styleClass="mb-3" [style]="{ 'border-radius': '1rem' }">
  <ng-template #start>
    <p-floatlabel variant="on">
      <input
        pInputText
        id="sale_order_search"
        [(ngModel)]="searchValue"
        autocomplete="off"
        (input)="table.filterGlobal($any($event.target).value, 'contains')"
      />
      <label for="sale_order_search">Search Sale Orders</label>
    </p-floatlabel>
  </ng-template>

  <ng-template #end>
    <button pButton  routerLink="/sale-order/createOrder">
      <i class="pi pi-plus"> Add</i>
    </button>
  </ng-template>
</p-toolbar>

<p-table
  #table
  [value]="saleOrders()"
  [globalFilterFields]="[
    'so_no',
    'customer.name',
    'store.name',
    'user.name',
    'status',
    'amount_status',
  ]"
  [tableStyle]="{ width: '100%' }"
  [paginator]="true"
  [rows]="10"
  [rowsPerPageOptions]="[5, 10, 20]"
  [lazy]="true"
  [totalRecords]="totalRecords"
  (onLazyLoad)="loadSaleOrders($event)"
  [scrollable]="true"
  scrollHeight="calc(100vh - 225px)"
>
  <ng-template #header>
    <tr>
      <!-- <th pSortableColumn="id">
        ID
        <p-sort-icon field="id"></p-sort-icon>
        <p-column-filter field="id" type="numeric" display="menu"></p-column-filter>
      </th> -->

      <th pSortableColumn="so_no">
        SO No
        <p-sort-icon field="so_no"></p-sort-icon>
        <p-column-filter field="so_no" type="text" display="menu"></p-column-filter>
      </th>

      <th pSortableColumn="customer.name">
        Customer
        <p-sort-icon field="customer.name"></p-sort-icon>
        <p-column-filter field="customer.name" type="text" display="menu"></p-column-filter>
      </th>

      <th pSortableColumn="store.name">
        Store
        <p-sort-icon field="store.name"></p-sort-icon>
        <p-column-filter field="store.name" type="text" display="menu"></p-column-filter>
      </th>

      <!-- <th pSortableColumn="user.name">
        Created By
        <p-sort-icon field="user.name"></p-sort-icon>
        <p-column-filter field="user.name" type="text" display="menu"></p-column-filter>
      </th> -->

      <th pSortableColumn="status">
        Status
        <p-sort-icon field="status"></p-sort-icon>
        <p-column-filter field="status" type="text" display="menu">
          <ng-template pTemplate="filter" let-value let-filter="filterCallback">
            <p-select
              [ngModel]="value"
              [options]="statusOptions"
              optionLabel="label"
              optionValue="value"
              placeholder="Any"
              (onChange)="filter($event.value)"
              [showClear]="true"
            >
            </p-select>
          </ng-template>
        </p-column-filter>
      </th>

      <th pSortableColumn="amount_status">
        Payment
        <p-sort-icon field="amount_status"></p-sort-icon>
        <p-column-filter field="amount_status" type="text" display="menu">
          <ng-template pTemplate="filter" let-value let-filter="filterCallback">
            <p-select
              [ngModel]="value"
              [options]="amount_status"
              optionLabel="label"
              optionValue="value"
              placeholder="Any"
              (onChange)="filter($event.value)"
              [showClear]="true"
            >
            </p-select>
          </ng-template>
        </p-column-filter>
      </th>

      <!-- <th pSortableColumn="grand_total">
        Grand Total
        <p-sort-icon field="grand_total"></p-sort-icon>
        <p-column-filter field="grand_total" type="numeric" display="menu"></p-column-filter>
      </th> -->
      <!-- 
      <th pSortableColumn="paid_amount">
        Paid
        <p-sort-icon field="paid_amount"></p-sort-icon>
        <p-column-filter field="paid_amount" type="numeric" display="menu"></p-column-filter>
      </th> -->

      <!-- <th pSortableColumn="due_amount">
        Due
        <p-sort-icon field="due_amount"></p-sort-icon>
        <p-column-filter field="due_amount" type="numeric" display="menu"></p-column-filter>
      </th> -->

      <th pSortableColumn="created_at">
        Date
        <p-sort-icon field="created_at"></p-sort-icon>
        <p-column-filter field="created_at" type="date" display="menu"></p-column-filter>
      </th>
    </tr>
  </ng-template>

  <ng-template #body let-item>
    <tr class="table_row" style="cursor: pointer" (click)="detailSaleOrder(item.id)">
      <!-- <td>{{ item.id }}</td> -->
      <td>{{ item.so_no }}</td>
      <td>{{ item.customer?.name }}</td>
      <td>{{ item.store?.name }}</td>
      <!-- <td>{{ item.user?.name }}</td> -->
      <td>{{ item.status }}</td>
      <td>{{ item.amount_status }}</td>
      <!-- <td>{{ item.grand_total | currency: 'PKR' }}</td> -->
      <!-- <td>{{ item.paid_amount | currency: 'PKR' }}</td> -->
      <!-- <td>{{ item.due_amount | currency: 'PKR' }}</td> -->
      <td>{{ item.created_at | date: 'dd-MM-yyyy' }}</td>
    </tr>
  </ng-template>
</p-table>
